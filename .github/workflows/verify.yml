name: Verify

on:
  push:
    branches: [main]
    paths-ignore:
      - 'verification/**'
      - 'release/v*/**'
      - 'release/trigger-v*.json'
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests
        run: npm test
      - name: Static/runtime verification
        run: npm run verify
      - name: Deterministic package build
        run: npm run package
      - name: Verify release checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt
      - name: Record verified source commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          mkdir -p verification
          cat > verification/latest.json <<JSON
          {
            "version": "$VERSION",
            "sourceCommit": "$GITHUB_SHA",
            "verifiedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "tests": "PASS",
            "staticRuntimeVerification": "PASS",
            "deterministicPackaging": "PASS",
            "checksumVerification": "PASS",
            "mcpTools": 23
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verification/latest.json
          git commit -m "chore: record verification proof for $GITHUB_SHA"
          git push origin HEAD:main
