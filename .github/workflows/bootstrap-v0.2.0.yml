name: Bootstrap v0.2.0 source and release

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/v0.2.0/**'

permissions:
  contents: write

env:
  SOURCE_SHA256: a3f8bd88f628d083b9e02fd5a58c314c8f9f7c1391e8e7b7fb4a45b44f02b7d4
  EXPECTED_PARTS: '9'
  RELEASE_TAG: v0.2.0

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Kiểm tra đủ bootstrap chunks
        id: parts
        shell: bash
        run: |
          count="$(find bootstrap/v0.2.0 -maxdepth 1 -type f -name 'source.part.*' 2>/dev/null | wc -l | tr -d ' ')"
          echo "count=$count"
          if [ "$count" = "$EXPECTED_PARTS" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Ghép và xác minh source ZIP
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          cat bootstrap/v0.2.0/source.part.* | base64 --decode > "$RUNNER_TEMP/source.zip"
          actual="$(sha256sum "$RUNNER_TEMP/source.zip" | awk '{print $1}')"
          test "$actual" = "$SOURCE_SHA256" || {
            echo "Source SHA mismatch: $actual" >&2
            exit 1
          }
          unzip -t "$RUNNER_TEMP/source.zip"

      - name: Thay bootstrap bằng source đã xác minh
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/source"
          rsync -a --delete --exclude='.git/' "$RUNNER_TEMP/source/" ./

      - uses: actions/setup-node@v4
        if: steps.parts.outputs.ready == 'true'
        with:
          node-version: 20

      - name: Kiểm chứng source và tạo release artifacts
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          npm test
          npm run verify
          npm run package
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Commit toàn bộ source và release artifacts lên main
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: release Nolane Sentinel v0.2.0'
          git push origin HEAD:main

      - name: Tạo tag release
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG đã tồn tại; không tạo lại."
            exit 0
          fi
          git tag -a "$RELEASE_TAG" -m "Nolane Sentinel $RELEASE_TAG"
          git push origin "$RELEASE_TAG"
