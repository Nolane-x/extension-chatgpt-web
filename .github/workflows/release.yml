name: Release

on:
  push:
    branches: [main]
    paths:
      - 'release/trigger-v*.json'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag release, ví dụ v0.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Xác định tag
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v$VERSION"
          fi
          test "$TAG" = "v$VERSION" || { echo "Tag $TAG không khớp package version v$VERSION" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Full release verification
        run: npm run release:check
      - name: Kiểm tra checksum
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt
      - name: Commit release mirror khi phát hành từ main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "release/v${{ steps.meta.outputs.version }}"
          if ! git diff --cached --quiet; then
            git commit -m "chore: mirror Nolane Sentinel ${{ steps.meta.outputs.tag }} artifacts"
            git push origin HEAD:main
          fi
      - name: Tạo tag release nếu chưa có
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG đã tồn tại; giữ nguyên tag."
          else
            git tag -a "$TAG" -m "Nolane Sentinel $TAG" "$(git rev-parse HEAD)"
            git push origin "$TAG"
          fi
      - name: Publish hoặc cập nhật GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          ASSETS=(
            "dist/nolane-sentinel-v${VERSION}-extension.zip"
            "dist/nolane-sentinel-v${VERSION}-native-bridge.zip"
            "dist/nolane-sentinel-v${VERSION}-source.zip"
            "dist/SHA256SUMS.txt"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "Nolane Sentinel $TAG" --notes-file "RELEASE_NOTES_v${VERSION}.md"
          fi
