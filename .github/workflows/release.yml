name: Release

on:
  push:
    branches: [main]
    paths:
      - 'release/trigger-v*.json'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag release, ví dụ v0.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Xác định tag
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v$VERSION"
          fi
          test "$TAG" = "v$VERSION" || { echo "Tag $TAG không khớp package version v$VERSION" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Full release verification
        run: npm run release:check
      - name: Kiểm tra checksum
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt
      - name: Commit release mirror khi phát hành từ main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "release/v${{ steps.meta.outputs.version }}"
          if ! git diff --cached --quiet; then
            git commit -m "chore: mirror Nolane Sentinel ${{ steps.meta.outputs.tag }} artifacts"
            git push origin HEAD:main
          fi
      - name: Tạo tag release nếu chưa có
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG đã tồn tại; giữ nguyên tag."
          else
            git tag -a "$TAG" -m "Nolane Sentinel $TAG" "$(git rev-parse HEAD)"
            git push origin "$TAG"
          fi
      - name: Publish hoặc cập nhật GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          ASSETS=(
            "dist/nolane-sentinel-v${VERSION}-extension.zip"
            "dist/nolane-sentinel-v${VERSION}-native-bridge.zip"
            "dist/nolane-sentinel-v${VERSION}-source.zip"
            "dist/SHA256SUMS.txt"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "Nolane Sentinel $TAG" --notes-file "RELEASE_NOTES_v${VERSION}.md"
          fi
      - name: Ghi bằng chứng GitHub Release đã publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          mkdir -p verification
          gh release view "$TAG" --json url,tagName,name,isDraft,isPrerelease,publishedAt,assets > "$RUNNER_TEMP/release.json"
          export TAG_TARGET="$(git rev-list -n 1 "$TAG")"
          node <<'NODE'
          const fs=require('fs');
          const release=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/release.json','utf8'));
          const proof={
            version:process.env.VERSION,
            tag:release.tagName,
            tagTarget:process.env.TAG_TARGET,
            name:release.name,
            url:release.url,
            publishedAt:release.publishedAt,
            draft:release.isDraft,
            prerelease:release.isPrerelease,
            assets:(release.assets||[]).map(a=>({name:a.name,size:a.size,state:a.state||null,digest:a.digest||null})).sort((a,b)=>a.name.localeCompare(b.name))
          };
          fs.writeFileSync(`verification/release-v${process.env.VERSION}.published.json`,JSON.stringify(proof,null,2)+'\n');
          NODE
          git add "verification/release-v${VERSION}.published.json"
          if ! git diff --cached --quiet; then
            git commit -m "chore: record published GitHub Release $TAG"
            git push origin HEAD:main
          fi
