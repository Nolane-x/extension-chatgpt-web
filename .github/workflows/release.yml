name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag release, ví dụ v0.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Xác định tag
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          test "$TAG" = "v$VERSION" || { echo "Tag $TAG không khớp package version v$VERSION" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - run: npm run release:check
      - name: Kiểm tra checksum
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt
      - name: Tạo tag khi chạy thủ công
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag "${{ steps.meta.outputs.tag }}" "${{ github.sha }}"
          git push origin "${{ steps.meta.outputs.tag }}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            dist/nolane-sentinel-v${{ steps.meta.outputs.version }}-extension.zip \
            dist/nolane-sentinel-v${{ steps.meta.outputs.version }}-native-bridge.zip \
            dist/nolane-sentinel-v${{ steps.meta.outputs.version }}-source.zip \
            dist/SHA256SUMS.txt \
            --title "Nolane Sentinel ${{ steps.meta.outputs.tag }}" \
            --notes-file "RELEASE_NOTES_v${{ steps.meta.outputs.version }}.md"
